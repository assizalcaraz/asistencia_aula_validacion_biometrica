version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DJANGO_HOST_IP: 192.168.1.16
    networks:
      - app_net


  nginx:
    image: nginx:latest
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/certs:/etc/nginx/certs
    depends_on:
      - web
    networks:
      - app_net

networks:
  app_net:
    driver: bridge
