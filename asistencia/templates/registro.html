{% extends "base.html" %}
{% block content %}
<h1>Registro de Estudiante</h1>

{% if messages %}
  <ul id="feedback">
    {% for message in messages %}
      <li class="{{ message.tags }}">{{ message }}</li>
    {% endfor %}
  </ul>
{% endif %}

<form method="POST" onsubmit="return enviarFormulario(event);">
  {% csrf_token %}
  <label>DNI:</label>
  <input type="text" name="dni" value="{{ dni }}" readonly>

  <label>Clave secreta:</label>
  <input type="password" name="clave" value="{{ clave }}" required>

  <label>Email:</label>
  <input type="email" name="email" required>

  <input type="hidden" name="selfie" id="selfie" value="{{ selfie }}">
  <button type="submit">Registrar</button>
  <div id="debug"></div>
</form>

<p style="margin-top: 1.5rem;">
  ¿Ya estás registrado? <a href="{% url 'asistencia' %}">Ir a dar presente</a>
</p>

<script>
const selfieInput = document.getElementById('selfie');
const debug = document.getElementById('debug');
if (!selfieInput.value || selfieInput.value.length < 100) {
  debug.innerText = '❌ Error: no se recibió una selfie válida.';
}
</script>
{% endblock %}
